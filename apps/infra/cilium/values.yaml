ipam:
  mode: kubernetes

kubeProxyReplacement: true

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

k8sServiceHost: localhost
k8sServicePort: 7445

gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true

l2announcements:
  enabled: true

bgpControlPlane:
  enabled: false

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
    service:
      type: LoadBalancer
  metrics:
    enabled:
      - drop
      - tcp
      - flow
      - port-distribution
      - icmp
      - dns
      - httpV2
    # Scrape label matches kube-prometheus-stack default selector
    serviceMonitor:
      enabled: true
      labels:
        release: kube-prometheus
    dashboards:
      enabled: true
      labels:
        grafana_dashboard: "1"

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: infra
  sources:
    - repoURL: https://charts.rook.io/release
      chart: rook-ceph
      targetRevision: v1.20.3
      helm:
        valueFiles:
          - $values/apps/infra/rook-ceph/values.yaml
    - repoURL: https://github.com/maeshinshin/k8s-clusters.git
      targetRevision: HEAD
      ref: values
      path: apps/infra/rook-ceph
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # The rook-ceph chart 1.20.3 has WATCH_NAMESPACE hardcoded to ""
  # (see ~/ISSUE.md). After first sync, patch the Deployment manually
  # with `kubectl patch deploy ceph-csi-controller-manager -n rook-ceph
  # --type json -p='[{"op":"replace","path":"/spec/template/spec/containers/0/env/2/value","value":"rook-ceph"}]'`
  # then ArgoCD will leave the manual change alone.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: ceph-csi-controller-manager
      namespace: rook-ceph
      jsonPointers:
        - /spec/template/spec/containers/0/env/2/value
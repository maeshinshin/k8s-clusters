apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ceph-csi-drivers
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: infra
  sources:
    - repoURL: https://ceph.github.io/ceph-csi-operator
      chart: ceph-csi-drivers
      targetRevision: 0.2.0
      helm:
        valueFiles:
          - $values/apps/infra/ceph-csi-drivers/values.yaml
    - repoURL: https://github.com/maeshinshin/k8s-clusters.git
      targetRevision: HEAD
      ref: values
      path: apps/infra/ceph-csi-drivers
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true